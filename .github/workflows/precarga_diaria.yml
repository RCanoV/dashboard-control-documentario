name: Precarga Diaria Dashboard (04:00 AM Perú)

on:
  schedule:
    # 09:05 UTC = 04:05 AM Perú (carga principal del corte 04AM del día)
    - cron: '5 9 * * *'
    # 10:30 UTC = 05:30 AM Perú (respaldo madrugada)
    - cron: '30 10 * * *'
  workflow_dispatch:

jobs:
  precargar_cache:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas psycopg2-binary pytz

      - name: Ejecutar precarga directa a Supabase
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python precargar_bd.py
