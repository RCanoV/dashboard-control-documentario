name: Reportes Diarios ACC

on:
  schedule:
    # 15:07 UTC = 10:07 AM Perú (lunes a viernes -> envía los 14 reportes de las 10:00)
    - cron: '7 15 * * 1-5'
    # 19:07 UTC = 14:07 PM Perú (lunes a viernes -> envía el reporte AS BUILT de las 14:00)
    - cron: '7 19 * * 1-5'
  workflow_dispatch:
    inputs:
      reporte_objetivo:
        description: 'Nombre exacto del reporte a enviar (vacío = todos los activos)'
        required: false
        default: ''

jobs:
  generar_y_enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas openpyxl reportlab pillow matplotlib

      - name: Ejecutar reportes diarios
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          REPORTE_OBJETIVO: ${{ github.event.inputs.reporte_objetivo }}
        run: python ejecutar_reportes_diarios.py
