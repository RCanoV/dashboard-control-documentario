name: Reportes Diarios ACC

on:
  schedule:
    - cron: '0 * * * *'   # Se ejecuta cada hora; Python valida los días y horarios de Perú (UTC-5)
  workflow_dispatch:
    inputs:
      reporte_objetivo:
        description: 'Nombre exacto del reporte a enviar (vacío = todos los activos)'
        required: false
        default: ''

jobs:
  generar_y_enviar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas openpyxl reportlab pillow

      - name: Ejecutar reportes diarios
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          REPORTE_OBJETIVO: ${{ github.event.inputs.reporte_objetivo }}
        run: python ejecutar_reportes_diarios.py
